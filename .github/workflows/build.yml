name: Build Iceraven

on:
  workflow_dispatch:
  push:
    branches:
      - runtime-modules

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble forkDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # AGP 9.4 / Gradle 9.7 run fine on 21, and the build targets JVM bytecode 17 (jvmTargetCompatibility).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android@v3 currently fails while running the legacy `sdkmanager tools`, so the command
      # line tools are installed by hand into a job local SDK instead.
      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # compileSdk comes from android-components/.config.yml (37.1) and the build tools version from
      # gradle/mozconfig.gradle (36.0.0).
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # forkDebug is the Iceraven build type: debug signed, applicationId suffix ".iceraven.debug",
      # so the result can be side installed next to the released app.
      - name: Build
        run: ./gradlew app:assembleForkDebug --stacktrace --max-workers=3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-forkdebug-apk
          path: app/build/outputs/apk/forkDebug/*.apk
          if-no-files-found: error