name: Build Iceraven

on:
  workflow_dispatch:
  push:
    branches:
      - runtime-modules

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble forkDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      # Same JDK as the project's own release workflow.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # The repository ships the SDK bootstrap it uses for releases: cmdline tools, license seeds and the NDK that
      # Gradle refuses to fetch on its own. Gradle then installs the platform and build tools itself.
      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      # patch_android_components.sh fixes the version catalog paths and dependency declarations inside the
      # android-components submodule, so the build cannot be configured without it. Its helpers call `python`, which
      # newer runner images no longer provide under that name.
      - name: Prepare android-components
        run: |
          if ! command -v python > /dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          ./automation/iceraven/patch_android_components.sh

      # The glean Gradle tasks shell out to this virtualenv, app/build.gradle points GLEAN_PARSER_VENV at venv/bin/python,
      # so no metrics source can be generated without it.
      - name: Setup glean python environment
        run: ./automation/iceraven/setup_venv.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # forkDebug is the Iceraven build type: debug signed, applicationId suffix ".iceraven.debug",
      # so the result can be side installed next to the released app.
      - name: Build forkDebug variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: ./gradlew app:assembleForkDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-forkdebug-apk
          path: app/build/outputs/apk/forkDebug/*.apk
          if-no-files-found: error

  # Proves that the module API is actually usable by an outside author: the example project is a standalone Gradle
  # build that compiles the SPI sources and produces an installable archive. Non blocking, so that a change to the
  # example never holds up the browser build.
  example-module:
    name: Assemble example module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: modules-example
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk/android-sdk-linux"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          for hash in 8933bad161af4178b1185d1a37fbf41ea5269c55 \
                      d56f5187479451eabf01fb78af6dfcb131a6481e \
                      24333f8a63b6825ea9c5514f83c2829b004d1fee \
                      85435445a95c234340d05367a999a69d7b46701c ; do
            echo "$hash" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          done
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd "$ANDROID_SDK_ROOT/cmdline-tools"
            wget --quiet "$(curl -s https://developer.android.com/studio \
              | grep -oP "https://dl.google.com/android/repository/commandlinetools-linux-[0-9]+_latest.zip")"
            unzip -q commandlinetools-linux-*_latest.zip
            mv cmdline-tools tools
          fi
          "$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble example module APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload example module APK
        uses: actions/upload-artifact@v4
        with:
          name: example-module-apk
          path: modules-example/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error